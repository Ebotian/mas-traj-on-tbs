[mypy]
# Type-legality config for the egress suite. Run: mypy --config-file egress/mypy.ini <targets>
# (test_type_legality.py runs exactly this as part of the suite).
mypy_path = /home/ebt/harbor-runs/egress:/home/ebt/harbor-runs/egress/tests:/home/ebt/harbor-runs/egress/gateway
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True

[mypy-yaml]
# PyYAML ships without stubs; the imports are deliberately unchecked.
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
